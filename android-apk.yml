name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Daymark_Todo_Website/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install app dependencies
        working-directory: Daymark_Todo_Website
        run: npm install

      - name: Build web app
        working-directory: Daymark_Todo_Website
        run: npm run build

      - name: Generate Android project
        working-directory: Daymark_Todo_Website
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: Daymark_Todo_Website
        run: npx cap sync android

      - name: Build debug-signed APK
        working-directory: Daymark_Todo_Website/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Daymark-Android-APK
          path: Daymark_Todo_Website/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
